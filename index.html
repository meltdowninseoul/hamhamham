<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>쭈토리의 모험</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#cfe9ff;--a:#3a9be8;--a2:#7cc4ff;--sh:#1f6fb8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f2036}}
:root[data-theme="dark"]{--bg:#0f2036}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);font-family:Jua,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;align-items:center;justify-content:center}
#wrap{position:relative;width:min(100vw,calc(100vh*16/9));width:min(100vw,calc(100dvh*16/9));aspect-ratio:16/9;container-type:inline-size;overflow:hidden;background:#cfe9ff;user-select:none;-webkit-user-select:none}
canvas{width:100%;height:100%;display:block}
.lg{color:var(--a);line-height:1.1;text-shadow:2px 0 #fff,-2px 0 #fff,0 2px #fff,0 -2px #fff,2px 2px #fff,-2px -2px #fff,2px -2px #fff,-2px 2px #fff}
.lg b{display:inline-block;background:#fff;border:2px solid var(--a2);border-radius:14px;padding:.1em .6em;font-weight:400;font-size:3cqw;text-shadow:none}
.lg h2{margin:.1em 0 0;font-weight:400;font-size:9cqw}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.8cqw;text-align:center}
.scr.on{display:flex}
#menu{display:flex;background:rgba(255,255,255,.28)}#menu.off{display:none}
.dim{background:rgba(10,30,60,.6)}
#tlogo{max-width:70%;max-height:38%;object-fit:contain;display:none}
#ts{color:#fff;font-size:2.8cqw;text-shadow:0 1px 3px var(--sh);margin-bottom:1cqw}
.mb,.pb,#go{font:inherit;border:.4cqw solid var(--a2);background:var(--a);color:#fff;cursor:pointer;text-decoration:none;display:inline-block;box-shadow:0 0 0 .4cqw #fff}
.mb{font-size:3.4cqw;min-width:30cqw;padding:.3em 1em}
.pb,#go{font-size:max(15px,2.6cqw);padding:.3em 1.2em;box-shadow:none;border-width:2px}
.mb.s,.pb.s{background:#fff;color:var(--a)}
.panel{background:#fff;color:#1f4d7a;border:3px solid var(--a2);box-shadow:0 0 0 3px #fff,6px 6px 0 3px var(--a2);padding:2.6cqw 4cqw;width:62cqw;display:flex;flex-direction:column;gap:1.6cqw;align-items:center}
.panel h2{margin:0;font-weight:400;font-size:4cqw}
.panel .mb{font-size:3cqw;min-width:34cqw}
#ht{white-space:pre-line;font-size:2.6cqw;line-height:1.7;text-align:left;align-self:stretch}
#it{white-space:pre-line;font-size:2.7cqw;line-height:1.7;min-height:7.2em;display:flex;align-items:center;justify-content:center;text-align:center}
#intro{justify-content:flex-end;padding-bottom:3cqw;box-sizing:border-box}
.panel.dlg{position:relative;width:86cqw;padding:3.2cqw 4cqw 1.6cqw;gap:.6cqw;border:.45cqw solid var(--a2);border-radius:1cqw;box-shadow:none;align-items:stretch}
.dlg #in{position:absolute;left:3cqw;top:-2.7cqw;background:var(--a);color:#fff;padding:.15em 1.2em;font-size:2.8cqw;border-radius:.8cqw;display:none}
.dlg #it{text-align:left;justify-content:flex-start;align-items:flex-start;min-height:2.2em;font-size:3cqw}
.dlg .pb{font-size:max(12px,2.2cqw);padding:.2em 1em}
.dlg .row{align-self:flex-end}
#modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,30,60,.6)}
#modal .panel{width:min(86%,46cqw)}
input[type=password]{width:100%;box-sizing:border-box;padding:.5em;font:inherit;font-size:max(15px,2.8cqw);border:2px solid var(--a2);text-align:center}
#msg{min-height:1.4em;font-size:max(13px,2.4cqw);color:#d8397a}
.row{display:flex;gap:8px;justify-content:center}
#go{display:none}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:sh .25s 2}
#gear{position:absolute;right:2%;top:2%;display:none;font-size:3.4cqw;width:6cqw;height:6cqw;border:2px solid var(--a2);background:#fffd;color:var(--a);cursor:pointer;line-height:1;padding:0}
.ing #gear{display:block}
#pad{position:absolute;left:2%;right:2%;bottom:3%;display:none;justify-content:space-between;pointer-events:none}
#pad div{display:flex;gap:2cqw}
#pad button{pointer-events:auto;touch-action:none;font:inherit;font-size:4cqw;min-width:11cqw;padding:.5em 0;border:3px solid var(--a2);background:#fffc;color:var(--a)}
@media (pointer:coarse){.ing #pad{display:flex}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="960" height="540"></canvas>
<button id="gear" aria-label="설정">⚙</button>
<div id="pad"><div><button id="bl">◀</button><button id="br">▶</button></div><button id="bj">점프</button></div>
<div id="menu" class="scr">
  <div class="lg"><b id="tb"></b><h2 id="tt"></h2></div><img id="tlogo" alt=""><div id="ts"></div>
  <button class="mb" id="bstart">게임 시작</button>
  <button class="mb s" id="bhow">게임 방법</button>
  <button class="mb s" id="bset">설정</button>
</div>
<div id="howto" class="scr dim"><div class="panel"><h2>게임 방법</h2><div id="ht"></div><button class="pb" id="hclose">닫기</button></div></div>
<div id="intro" class="scr"><div class="panel dlg"><div id="in"></div><div id="it"></div><div class="row"><button class="pb" id="inext"></button><button class="pb s" id="iskip">건너뛰기</button></div></div></div>
<div id="set" class="scr dim"><div class="panel"><h2>설정</h2>
  <button class="mb s" id="mus"></button>
  <button class="mb s" id="sfx"></button>
  <button class="mb" id="sclose">닫기</button>
  <button class="mb s" id="tomenu">메인 화면으로</button></div></div>
<div id="modal"><div class="panel"><h2>"비밀번호를 말해줘!"</h2>
<input id="pw" type="password" autocomplete="off" maxlength="40" placeholder="비밀번호"><div id="msg"></div>
<div class="row"><button class="pb" id="ok">확인</button><button class="pb s" id="x">닫기</button></div>
<a id="go" target="_blank" rel="noopener">비밀 사이트로 이동</a></div></div>
</div>
<script>
// ===== 설정 (여기만 고치면 돼요) =====
const PASSWORD="hamster", TARGET_URL="https://example.com";
const BUBBLE="두근두근", TITLE="쭈토리의 모험", SUB="~ 성으로 가는 길 ~";
// 게임 방법 화면에 나오는 글 (자유롭게 고치세요. 줄바꿈 그대로 보여요)
const HOWTO=`← → 방향키로 움직여요
SPACE 키로 점프해요
가시, 바위, 구덩이를 피해서
성에서 기다리는 친구에게 가요!
도착하면 친구를 클릭해 보세요.
(폰에서는 화면 아래 버튼을 눌러요)`;
// 시작 전 이야기: "이름: 대사" 는 대화, 괄호 ( ) 로 쓰면 설명이에요. 한 줄이 한 화면이고 줄을 추가/삭제하면 돼요. 비워두면 바로 시작해요
const HERO="쭈토리", FRIEND="엄스터";   // 대화에서 말하는 사람 이름 (왼쪽/오른쪽 캐릭터)
const INTRO=[
 "(쭈토리는 오늘도 해바라기씨를 열심히 파밍 중이었어요.)",
 "쭈토리: 오늘은 해바라기씨가 정말 많이 모였다! 히히.",
 "(그때, 바람을 타고 편지 한 장이 날아왔어요.)",
 "쭈토리: 이게 뭐지 성으로 오삼?",
 "엄스터: 아니 형 뭐 해 왜 아직도 해바라기씨를 줍고 있어",
 "쭈토리: 성현이 성격 급하네 또 시작이다",
 "엄스터: 응 빨리 와 오면 비밀 이야기 해 준다",
 "쭈토리: 비밀? 두근두근… 무슨 비밀인데?",
 "엄스터: 와서 물어보삼 도착하면 꾸욱 해",
 "쭈토리: 알겠어 기다려",
 "(쭈토리는 두근두근 성으로 달려가기로 했어요!)"
];
// 배경음악: 둘 다 비워두면 기본 효과음/멜로디가 나와요
const BGM_MP3="";        // 예) "audio/bgm.mp3"  (GitHub에 올린 mp3 경로)
const BGM_YOUTUBE="";    // 예) "https://youtu.be/XXXXXXXXXXX"  (GitHub Pages 등에서 동작)
// 이미지: "타이틀"(첫 화면 배경) "로고" "배경"(게임 배경) "나"(주인공) "햄스터"(성의 친구)
// 비우면 기본 픽셀 캐릭터가 나와요. images 폴더에 title/logo/bg/me/ham.png 로 올리면 자동 적용돼요.
const IMG={};
// 장애물 (x 위치를 바꾸거나 지우면 난이도가 바뀌어요. 성 위치 1290)
const spikes=[{x:320,n:2},{x:980,n:2}];
const rocks=[{x:560,w:24,h:24},{x:1120,w:24,h:28}];
const pits=[{x:760,w:40}];
const cps=[0,680,1040];   // 죽으면 다시 시작하는 지점(깃발)
// ================================
const $=id=>document.getElementById(id);
const c=$('c'),g=c.getContext('2d'),wrap=$('wrap');
const W=480,H=270,GY=220,WORLD=1500,HXC=1380;
$('go').href=TARGET_URL;$('tb').textContent=BUBBLE;$('tt').textContent=TITLE;$('ts').textContent=SUB;$('ht').textContent=HOWTO;
const LOAD={};
function setImg(k,src){const im=new Image();im.onload=()=>{LOAD[k]=im;if(k==='로고'){$('tlogo').src=src;$('tlogo').style.display='block';$('tb').style.display=$('tt').style.display='none'}};im.src=src}
for(const k in IMG)setImg(k,IMG[k]);
const AUTO={"타이틀":"images/title.png","로고":"images/logo.png","배경":"images/bg.png","나":"images/me.png","햄스터":"images/ham.png"};
for(const k in AUTO)if(!IMG[k])setImg(k,AUTO[k]);

const MAIN=[".ooo........ooo.", "oppooooooooooppo", "oppooooooooooppo", "oooooooooooooooo", "oockkcccccckkcoo", "oockkcccccckkcoo", "occccccppcccccco", "occcccccccccccco", ".occcccccccccco.", "..occcccccccco..", "...cccccccccc...", "...pp......pp..."],
 GOAL=[".www........www.", "wppwwwwwwwwwwppw", "wppwwwwwwwwwwppw", "bbwwwwwwwwwwwwbb", "bbwkkwwwwwwkkwbb", "wwwkkwwwwwwkkwww", "wwwwwwwppwwwwwww", "wwwwwwwwwwwwwwww", ".wwwwwwwwwwwwww.", "..wwwwwwwwwwww..", "...wwwwwwwwww...", "...pp......pp..."];
const PAL={o:'#f08a2a',c:'#ffe9b8',p:'#f4a6b4',k:'#2a1a2e',w:'#ffffff',s:'#bfe6ff',b:'#3a9be8',l:'#2a1a2e',d:'#3a4a7a'};
function outl(m,ch){const h=m.length,w=m[0].length,o=[];for(let j=-1;j<=h;j++){let row='';for(let i=-1;i<=w;i++){const v=(j>=0&&j<h&&i>=0&&i<w)?m[j][i]:'.';if(v!=='.'){row+=v;continue}let n=false;for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){const y=j+dj,x=i+di;if(y>=0&&y<h&&x>=0&&x<w&&m[y][x]!=='.')n=true}row+=n?ch:'.'}o.push(row)}return o}
const MP=outl(MAIN,'l'),GP=outl(GOAL,'l');
const SPK=["...kk...","..kddk..","..kddk..",".kddddk.",".kddddk.","kddddddk","kddddddk","kkkkkkkk"];
function R(col,x,y,w,h){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),w,h)}
function spr(m,x,y,s,flip){const w=m[0].length;for(let j=0;j<m.length;j++)for(let i=0;i<w;i++){const ch=m[j][flip?w-1-i:i];if(ch!=='.')R(PAL[ch],x+i*s,y+j*s,s,s)}}
function pic(k,cx,by,h,flip){const im=LOAD[k],w=h*im.width/im.height;g.save();if(flip){g.translate(cx,0);g.scale(-1,1);g.drawImage(im,-w/2,by-h,w,h)}else g.drawImage(im,cx-w/2,by-h,w,h);g.restore()}
function txt(s,x,y,col,size,al){g.font='bold '+(size||13)+'px Jua,sans-serif';g.textAlign=al||'center';g.lineWidth=4;g.strokeStyle='#1f4d7a';g.strokeText(s,x,y);g.fillStyle=col||'#fff';g.fillText(s,x,y)}

// ----- 사운드 -----
let mus=true,sfx=true;try{mus=localStorage.getItem('jt_mus')!=='0';sfx=localStorage.getItem('jt_sfx')!=='0'}catch(e){}
let ac=null,au=null,yt=null,bgmT=null,mstep=0;
const MEL=[523,587,659,784,659,587,523,392,523,587,659,784,880,784,659,587];
function A(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac}
function beep(f1,f2,d,type,v,m){if(!(m?mus:sfx))return;const a=A();if(!a)return;const o=a.createOscillator(),gn=a.createGain(),n=a.currentTime;
  o.type=type||'square';o.frequency.setValueAtTime(f1,n);o.frequency.exponentialRampToValueAtTime(f2,n+d);
  gn.gain.setValueAtTime(v||.05,n);gn.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(gn);gn.connect(a.destination);o.start();o.stop(n+d)}
function ytId(){const m=BGM_YOUTUBE.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);return m?m[1]:null}
function ytCmd(f){if(yt&&yt.contentWindow)yt.contentWindow.postMessage(JSON.stringify({event:'command',func:f,args:[]}),'*')}
function bgmOn(){
  if(!mus)return;
  if(BGM_MP3){if(!au){au=new Audio(BGM_MP3);au.loop=true;au.volume=.5}au.play().catch(()=>{})}
  else if(ytId()){if(!yt){yt=document.createElement('iframe');yt.allow='autoplay';
      yt.src='https://www.youtube.com/embed/'+ytId()+'?enablejsapi=1&loop=1&controls=0&playlist='+ytId();
      yt.style.cssText='position:absolute;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none;border:0';
      yt.onload=()=>{if(mus)setTimeout(()=>ytCmd('playVideo'),400)};wrap.appendChild(yt)}else ytCmd('playVideo')}
  else if(!bgmT){bgmT=setInterval(()=>{const f=MEL[mstep++%MEL.length];beep(f,f,.2,'triangle',.03,1)},260)}
}
function bgmOff(){if(au)au.pause();ytCmd('pauseVideo');if(bgmT){clearInterval(bgmT);bgmT=null}}

// ----- 화면/메뉴 -----
let state='title',cam=0,deaths=0,t=0,cp=0,deadT=0,modal=false,panel=null,paused=false;
const p={x:20,y:GY-20,vy:0,on:true,f:1},keys={};
function showPanel(id){hidePanel();panel=id;$(id).classList.add('on')}
function hidePanel(){['howto','set'].forEach(i=>$(i).classList.remove('on'));panel=null}
function syncSnd(){$('mus').textContent='배경음: '+(mus?'켜짐 🎵':'꺼짐 🔇');$('sfx').textContent='효과음: '+(sfx?'켜짐 🔊':'꺼짐 🔇')}
function reset(){p.x=20;p.y=GY-20;p.vy=0;p.on=true;p.f=1;cp=0;deaths=0}
function start(){reset();state='play';$('menu').classList.add('off');wrap.classList.add('ing');A();bgmOn()}
function toMenu(){reset();state='title';$('menu').classList.remove('off');wrap.classList.remove('ing');closeModal();$('go').style.display='none';$('ok').style.display=''}
let ii=0,IS=null;
function showIntro(){
  const m=INTRO[ii].match(/^([^:：(（]{1,10})[:：]\s*([\s\S]+)$/),who=m?m[1].trim():'',tag=$('in');
  $('it').textContent=m?m[2]:INTRO[ii];
  IS=who===HERO?'hero':who===FRIEND?'friend':null;
  tag.style.display=who?'block':'none';tag.textContent=who;tag.style.background=IS==='friend'?'#4aa8f0':'#4cc38a';
  $('inext').textContent=ii>=INTRO.length-1?'출발! ▶':'다음 ▶'}
function openIntro(){if(!INTRO.length){start();return}reset();state='intro';ii=0;$('menu').classList.add('off');$('intro').classList.add('on');showIntro();A();bgmOn()}
function nextIntro(){if(ii>=INTRO.length-1){endIntro();return}ii++;showIntro()}
function endIntro(){$('intro').classList.remove('on');start()}
$('inext').onclick=nextIntro;$('iskip').onclick=endIntro;
$('bstart').onclick=openIntro;
$('bhow').onclick=()=>showPanel('howto');
$('bset').onclick=()=>{$('tomenu').style.display='none';syncSnd();showPanel('set')};
$('gear').onclick=()=>{if(modal)return;paused=true;for(const k in keys)keys[k]=false;$('tomenu').style.display='';syncSnd();showPanel('set')};
$('hclose').onclick=hidePanel;
$('sclose').onclick=()=>{hidePanel();paused=false};
$('tomenu').onclick=()=>{hidePanel();paused=false;toMenu()};
$('mus').onclick=()=>{mus=!mus;try{localStorage.setItem('jt_mus',mus?'1':'0')}catch(e){}syncSnd();if(mus)bgmOn();else bgmOff()};
$('sfx').onclick=()=>{sfx=!sfx;try{localStorage.setItem('jt_sfx',sfx?'1':'0')}catch(e){}syncSnd();beep(660,880,.1)};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b)b.blur()});

addEventListener('keydown',e=>{
  if(state==='intro'&&(e.code==='Space'||e.code==='Enter')){e.preventDefault();nextIntro();return}
  if(e.key==='Escape'&&panel){hidePanel();paused=false;return}
  if(modal||panel||document.activeElement===$('pw'))return;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();
  keys[e.code]=true});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
[['bl','ArrowLeft'],['br','ArrowRight'],['bj','Space']].forEach(([id,code])=>{const b=$(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();keys[code]=true});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[code]=false))});

function hamSize(){const im=LOAD['햄스터'];return im?{w:44*im.width/im.height,h:44}:{w:36,h:28}}
function mouse(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width+cam,y:(e.clientY-r.top)*H/r.height}}
function overHam(m){const s=hamSize();return Math.abs(m.x-HXC)<s.w/2+10&&m.y>GY-s.h-10&&m.y<GY+6}
c.addEventListener('click',e=>{if(state==='ready'&&!paused&&!modal&&overHam(mouse(e)))openModal()});
c.addEventListener('mousemove',e=>{c.style.cursor=(state==='ready'&&overHam(mouse(e)))?'pointer':'default'});
function openModal(){modal=true;$('modal').style.display='flex';$('msg').textContent='';$('pw').value='';setTimeout(()=>$('pw').focus(),50)}
function closeModal(){modal=false;$('modal').style.display='none'}
function check(){
  if($('pw').value.trim()===PASSWORD){$('msg').textContent='정답! 문이 열렸어요 ♥';$('go').style.display='inline-block';$('ok').style.display='none';[784,988,1175,1568].forEach((f,i)=>setTimeout(()=>beep(f,f,.18,'triangle',.07),i*110))}
  else{$('msg').textContent='비밀번호가 달라요. 다시 입력해 보세요.';beep(220,150,.2,'sawtooth');const b=document.querySelector('#modal .panel');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}}
$('ok').onclick=check;$('x').onclick=closeModal;
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')check();if(e.key==='Escape')closeModal()});

// ----- 게임 -----
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function die(){if(state!=='play')return;state='dead';deadT=0;deaths++;beep(320,60,.35,'sawtooth',.06)}
function update(){
  if(paused)return;
  t++;
  if(state==='dead'){if(++deadT>40){p.x=cp?cp:20;p.y=GY-20;p.vy=0;p.on=true;state='play'}}
  else if(state==='walk'){p.x+=2;if(p.x>=1335){p.x=1335;state='ready';[659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,f,.15,'triangle',.06),i*120))}}
  else if(state==='play'){
    const dx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);
    p.x+=dx*2.4;if(dx)p.f=dx;if(p.x<0)p.x=0;
    if(keys.Space&&p.on){p.vy=-8.6;beep(380,760,.12)}
    p.on=false;p.vy+=.45;p.y+=p.vy;
    const cx=p.x+8,inPit=pits.some(q=>cx>q.x+4&&cx<q.x+q.w-4);
    if(!inPit&&p.vy>=0&&p.y+20>=GY&&p.y<GY){p.y=GY-20;p.vy=0;p.on=true}
    if(p.y>H+10)die();
    const b={x:p.x-3,y:p.y+3,w:22,h:17};
    spikes.forEach(s=>{if(hit(b,{x:s.x+3,y:GY-12,w:s.n*16-6,h:12}))die()});
    rocks.forEach(r=>{if(hit(b,{x:r.x+1,y:GY-r.h,w:r.w-2,h:r.h}))die()});
    cps.forEach(x=>{if(p.x>x&&x>cp)cp=x});
    if(p.x>1260)state='walk';
  }
  cam=state==='intro'?0:Math.max(0,Math.min(WORLD-W,p.x-170));
}
function drawIntro(){
  [[MP,60,'hero'],[GP,W-60-72,'friend']].forEach(([m,x,id])=>{
    const on=IS===id,b=on?Math.abs(Math.sin(t/9))*5:0;
    g.globalAlpha=(IS&&!on)?.75:1;spr(m,x,106-b,4,id==='friend');g.globalAlpha=1})
}
function draw(){
  g.setTransform(2,0,0,2,0,0);g.imageSmoothingEnabled=true;
  const bgI=LOAD['배경'],ttl=LOAD['타이틀'],back=(state==='title'&&ttl)?ttl:bgI;
  if(back){const s=Math.max(W/back.width,H/back.height);g.drawImage(back,(W-back.width*s)/2,(H-back.height*s)/2,back.width*s,back.height*s)}
  else{
    ['#7ccbff','#9bd8ff','#b9e4ff','#d6f0ff'].forEach((col,i)=>R(col,0,i*55,W,56));
    for(let i=0;i<7;i++){const x=((i*190-cam*.4+t*.1)%(W+120)+W+120)%(W+120)-60,y=24+(i*37)%70;R('#fff',x,y,44,10);R('#fff',x+8,y-8,28,10)}
    for(let x=0;x<W;x+=4){const h=34+Math.sin((x+cam*.3)/48)*16;R('#8fd9b4',x,GY-h,4,h)}
    for(let x=0;x<W;x+=4){const h=14+Math.sin((x+cam*.6)/30+2)*8;R('#6fc79c',x,GY-h,4,h)}}
  const cx=1290-cam;
  R('#a9bfe0',cx+20,GY-110,140,110);
  for(let i=0;i<7;i++)R('#a9bfe0',cx+20+i*22,GY-120,12,10);
  [cx,cx+144].forEach(x=>{R('#bcd0ee',x,GY-150,36,150);for(let i=0;i<3;i++)R('#bcd0ee',x+i*13,GY-160,10,10);R('#3a4a7a',x+14,GY-120,8,16)});
  for(let j=0;j<9;j++)for(let i=0;i<9;i++)if((i+j)%2===0)R('#8aa0c4',cx+24+i*15,GY-100+j*11,14,2);
  R('#3a4a7a',cx+72,GY-52,36,52);R('#3a4a7a',cx+76,GY-58,28,6);
  R('#4a3b5c',cx+18,GY-190,3,40);R('#3a9be8',cx+21,GY-190,16,10);
  R('#6fd89a',0,GY,W,6);R('#8a6a4a',0,GY+6,W,H);
  for(let x=-(cam%32);x<W;x+=32)for(let y=GY+10;y<H;y+=16)R('#775a3d',x+((y/16)%2)*16,y,14,6);
  if(state==='intro'){drawIntro();return}
  pits.forEach(q=>R('#14233d',q.x-cam,GY,q.w,H-GY));
  cps.slice(1).forEach(x=>{R('#4a3b5c',x-cam,GY-34,3,34);R(cp>=x?'#fff36a':'#9db4d6',x+3-cam,GY-34,14,9)});
  spikes.forEach(s=>{for(let i=0;i<s.n;i++)spr(SPK,s.x+i*16-cam,GY-16,2)});
  rocks.forEach(r=>{const x=r.x-cam,y=GY-r.h;R('#7a8fb5',x,y+4,r.w,r.h-4);R('#7a8fb5',x+4,y,r.w-8,6);R('#a6b8d8',x+4,y+2,r.w-12,4);R('#5a6e94',x,y+r.h-4,r.w,4)});
  const hb=(state==='ready'||state==='intro')?Math.abs(Math.sin(t/12))*4:0,hs=hamSize();
  if(LOAD['햄스터'])pic('햄스터',HXC-cam,GY-hb,44);else spr(GP,HXC-18-cam,GY-28-hb,2);
  if(state==='ready')txt('클릭!',HXC-cam,GY-hs.h-8-hb,'#fff36a',13);
  if(!(state==='dead'&&Math.floor(deadT/4)%2)){
    if(LOAD['나'])pic('나',p.x+8-cam,p.y+20,44,p.f<0);
    else{const bob=(p.on&&(keys.ArrowLeft||keys.ArrowRight||state==='walk')&&Math.floor(t/6)%2)?1:0;spr(MP,p.x+8-18-cam,p.y+20-28-bob,2,p.f<0)}}
  if(state!=='title'&&state!=='intro'){
    txt('실수 '+deaths,10,18,'#fff',12,'left');
    R('#1f4d7a',W/2-54,10,108,8);R('#fff36a',W/2-52,12,Math.min(104,104*p.x/1335),4)}
}
(function loop(){update();draw();requestAnimationFrame(loop)})();
syncSnd();
</script>
